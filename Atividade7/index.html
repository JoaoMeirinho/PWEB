<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedra, Papel e Tesoura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Pedra, Papel e Tesoura</h1>

        <div class="botoes">
            <button id="pedra" class="btn">Pedra</button>
            <button id="papel" class="btn">Papel</button>
            <button id="tesoura" class="btn">Tesoura</button>
        </div>

        <div class="resultado-container">
            <p>Você escolheu: <strong id="escolha-usuario">-</strong></p>
            <p>Computador escolheu: <strong id="escolha-computador">-</strong></p>
            <h2 id="mensagem-resultado"></h2>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
